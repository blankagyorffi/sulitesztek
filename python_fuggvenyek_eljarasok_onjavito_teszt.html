<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python – Függvények és eljárások | Önellenőrző teszt</title>
<style>
  code{font-family:"Consolas","Courier New",monospace;background:#f1f3f5;padding:2px 5px;border-radius:4px}
  pre.code{font-family:"Consolas","Courier New",monospace;background:#1e1e1e;color:#f8f8f2;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:15px;line-height:1.5;margin:12px 0}
  .question .code-label{font-size:.85em;color:#666;margin-bottom:3px}

  body{font-family:Arial,sans-serif;line-height:1.5;background:#f4f6f8;color:#222;margin:0}
  .container{max-width:900px;margin:30px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 4px 18px #0002}
  h1{margin-top:0}
  .intro{background:#eef5ff;padding:15px;border-radius:10px}
  .question{border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0}
  .question h3{margin-top:0}
  label{display:block;padding:9px;border-radius:7px;cursor:pointer}
  label:hover{background:#f3f3f3}
  button{background:#1769aa;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:16px;margin:5px}
  button:hover{background:#0d4f82}
  #result{font-size:20px;font-weight:bold;margin:20px 0;padding:15px;border-radius:10px}
  .correct{background:#d9f5df;border-color:#49a85a!important}
  .incorrect{background:#ffe0e0;border-color:#d9534f!important}
  .explanation{margin-top:10px;padding:10px;background:#fff8d8;border-radius:7px;display:none}
  .hidden{display:none}
  .progress{font-weight:bold}
  .small{font-size:.92em;color:#555}
  .review{font-size:16px;font-weight:normal;margin-top:14px;padding:12px 14px;background:#fff;border:1px solid #ddd;border-radius:10px}
  .review h4{margin:0 0 8px}
  .review ul{margin:0;padding-left:20px}
  .review li{margin:8px 0}
  .review a{color:#1769aa;cursor:pointer;text-decoration:underline}
  .review .ok{color:#2e7d32;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>Python – Függvények és eljárások</h1>
<div class="intro">
  <p><strong>Önellenőrző teszt – 16 kérdés</strong></p>
  <p>Jelöld be minden kérdésnél az egyetlen helyes választ, majd kattints az
  <strong>„Ellenőrzés”</strong> gombra. A teszt automatikusan kijavítja a válaszokat,
  megmutatja a pontszámot és rövid magyarázatot ad.</p>
  <p class="small">Javasolt szint: középiskolai Python-alapok.</p>
</div>

<div id="quiz"></div>

<div>
  <button onclick="checkAnswers()">Ellenőrzés</button>
  <button onclick="resetQuiz()">Újrakezdés</button>
</div>
<div id="result" class="hidden"></div>
</div>

<script>
const questions = [
{q:`Melyik kulcsszóval definiálunk függvényt vagy eljárást Pythonban?`,a:["function","def","func","define"],c:1,e:"Pythonban mind a függvényt, mind az eljárást a def kulcsszóval kezdjük. Hogy melyik a kettő közül, azt dönti el, hogy van-e benne return."},
{q:`Melyik a helyes függvénydefiníció? (A függvény a köszöntő szöveget <strong>visszaadja</strong>.)`,a:["<code>def koszon(nev): return 'Szia, ' + nev</code>","<code>function koszon(nev): return 'Szia, ' + nev</code>","<code>def koszon[nev]: return 'Szia, ' + nev</code>","<code>create koszon(nev): return 'Szia, ' + nev</code>"],c:0,e:"A helyes forma: def függvénynév(paraméterek): – a törzsben a return sor adja vissza az eredményt."},
{q:`Hogyan írjuk ki a függvény által visszaadott értéket?<pre class="code">def koszon():\n    return "Szia!"</pre>`,a:["call koszon","print(koszon())","def koszon()","print(koszon)"],c:1,e:"A függvény meghívása a nevével és zárójelekkel történik: koszon(). Mivel a függvény csak visszaadja a szöveget, a print(koszon()) írja ki a képernyőre."},
{q:`Mi a paraméter egy függvényben?`,a:["A függvény neve","A függvénynek átadható bemeneti adat neve","A visszatérési érték","Egy kötelezően kiírandó szöveg"],c:1,e:"A paraméter a függvény definíciójában megadott változó, amelyen keresztül adatot kaphat a függvény."},
{q:`Mit ad vissza ez a függvény?<pre class="code">def duplaz(x):\n    return x * 2</pre>`,a:["Mindig 2-t","Az x kétszeresét","Semmit","Az x felét"],c:1,e:"A return x * 2 az x értékének kétszeresét adja vissza."},
{q:`Mi a return utasítás legfontosabb szerepe?`,a:["Ciklust indít","Függvényt definiál","Értéket ad vissza a függvény hívójának","Kiírja az értéket a képernyőre"],c:2,e:"A return a függvény eredményét visszaadja a hívó programrésznek, és lezárja az adott függvényfutást. A return jelenléte különbözteti meg a függvényt az eljárástól."},
{q:`Mi történik az alábbi hívásnál?<pre class="code">print(osszeg(3, 5))</pre><div class="code-label">ha a függvény:</div><pre class="code">def osszeg(a, b):\n    return a + b</pre>`,a:["8 jelenik meg","35 jelenik meg","3 jelenik meg","Hiba történik, mert két paraméter nem adható át"],c:0,e:"A függvény 3 + 5 értékét adja vissza, a print pedig ezt kiírja: 8."},
{q:`Melyik állítás igaz a lokális változóra?<pre class="code">def szamol(x):\n    eredmeny = x * 3\n    return eredmeny</pre>`,a:["A program minden részéből automatikusan elérhető","Csak a Python beépített függvényeiben használható","Általában csak azon függvényen belül érhető el, ahol létrehozták (pl. az eredmeny a szamol-on belül)","Mindig globális változó"],c:2,e:"A függvényen belül létrehozott lokális változó hatóköre alapvetően az adott függvényre korlátozódik. Kívülről csak a return által visszaadott érték érhető el."},
{q:`Mi különbözteti meg a függvényt az eljárástól?`,a:["A függvényben van return, amely értéket ad vissza; az eljárásban nincs return, csak végrehajt valamit (pl. kiír)","Az eljárás a def kulcsszóval készül, a függvény nem","A függvénynek mindig van paramétere, az eljárásnak soha","Nincs közöttük különbség"],c:0,e:"A függvény return utasítással értéket ad vissza a hívónak, az eljárás pedig csak elvégez egy műveletet (pl. print), és nem ad vissza értéket. (Pythonban technikailag mindkettő def-fel készül, az eljárás hívása None értéket ad.)"},
{q:`Minek nevezzük az alábbi alprogramot?<pre class="code">def uzenet():\n    print("Hello")</pre>`,a:["Eljárás, mert nincs benne return, csak kiír","Függvény, mert a def-fel készült","Függvény, mert van benne print","Ciklus"],c:0,e:"Nincs benne return, nem ad vissza értéket, csak végrehajt egy műveletet (kiír), ezért eljárás. Ha a hívását kiíratnánk (print(uzenet())), a None jelenne meg."},
{q:`Melyik állítás igaz az alábbi két alprogramra?<pre class="code">def kiir(x):\n    print(x * 2)\n\ndef szamol(x):\n    return x * 2</pre>`,a:["A kiir eljárás, a szamol függvény","A kiir függvény, a szamol eljárás","Mindkettő függvény","Mindkettő eljárás"],c:0,e:"A szamol tartalmaz return sort, ezért függvény. A kiir csak kiír, nincs return, ezért eljárás."},
{q:`Melyik hívás adja át helyesen a 10 értéket az <code>x</code> paraméternek?<pre class="code">def negyzet(x):\n    return x * x</pre>`,a:["negyzet = 10","negyzet(10)","def negyzet(10)","return negyzet(10)"],c:1,e:"A negyzet(10) hívás az x paraméternek a 10 értéket adja át, a függvény pedig visszaadja a 100-at."},
{q:`Mi történik az alábbi függvény hívásakor?<pre class="code">def fv():\n    return 1\n    print("Soha")</pre>`,a:["Visszaadja az 1-et, a print már nem fut le","Kiírja a Soha szöveget, majd visszaadja az 1-et","Az 1-et és a Soha szöveget is visszaadja","Hibát jelez"],c:0,e:"A return befejezi az aktuális függvény végrehajtását, ezért az utána lévő utasítások nem futnak le abban a hívásban."},
{q:`Melyik függvényhívás eredménye 25?<pre class="code">def negyzet(x):\n    return x * x</pre>`,a:["negyzet(5)","negyzet(10)","negyzet(20)","negyzet(2)"],c:0,e:"5 * 5 = 25, ezért a negyzet(5) hívás eredménye 25."},
{q:`Miért hasznos függvényeket készíteni?`,a:["Csak azért, hogy hosszabb legyen a program","Az ismétlődő feladatok újrafelhasználhatók, az eredményt a return visszaadja, és a program áttekinthetőbb lehet","Mert így nincs szükség változókra","Mert a Python csak függvényekből állhat"],c:1,e:"A függvényekkel a program részei újra felhasználhatók, csökkenthető a kódismétlés és javítható az áttekinthetőség."},
{q:`Melyik kód számolja ki két szám átlagát és adja vissza az eredményt (függvényként)?`,a:["def atlag(a,b): return (a+b)/2","def atlag(a,b): print(a+b/2)","def atlag(a,b): return a+b*2","def atlag(a,b): average = a+b"],c:0,e:"A két szám összegét 2-vel kell osztani, az eredményt pedig return-nel kell visszaadni: return (a+b)/2. A print-es változat eljárás lenne."}
];

const quiz = document.getElementById("quiz");

questions.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="question";
  div.id="q"+i;
  div.innerHTML=`<h3>${i+1}. ${item.q}</h3>`+
    item.a.map((ans,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${ans}</label>`).join("")+
    `<div class="explanation" id="e${i}"></div>`;
  quiz.appendChild(div);
});

function checkAnswers(){
  let score=0, answered=0;
  const wrong=[];
  questions.forEach((item,i)=>{
    const box=document.getElementById("q"+i);
    const exp=document.getElementById("e"+i);
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    box.classList.remove("correct","incorrect");
    if(selected){
      answered++;
      if(Number(selected.value)===item.c){score++; box.classList.add("correct");}
      else {box.classList.add("incorrect"); wrong.push({i:i,given:Number(selected.value)});}
      exp.innerHTML="<strong>Magyarázat:</strong> "+item.e;
      exp.style.display="block";
    } else {
      box.classList.add("incorrect");
      wrong.push({i:i,given:null});
      exp.innerHTML="<strong>Nem válaszoltál.</strong> Helyes válasz: "+String.fromCharCode(65+item.c)+") "+item.a[item.c]+"<br>"+item.e;
      exp.style.display="block";
    }
  });
  const percent=Math.round(score/questions.length*100);
  let grade = percent>=90?"Kiváló":percent>=75?"Jó":percent>=60?"Megfelelő":"Gyakorlás javasolt";
  const result=document.getElementById("result");
  result.classList.remove("hidden");
  result.innerHTML=`Eredmény: ${score}/${questions.length} pont (${percent}%) – <strong>${grade}</strong><br>
  <span class="small">Megválaszolt kérdések: ${answered}/${questions.length}. A hibás válaszok alatt látható a magyarázat.</span>`+buildReview(wrong);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function buildReview(wrong){
  if(!wrong.length) return `<div class="review"><h4>Hibavisszajelző</h4><span class="ok">Hibátlan! Minden kérdésre jól válaszoltál.</span></div>`;
  const items=wrong.map(w=>{
    const it=questions[w.i];
    const title=it.q.split("<")[0].trim();
    const given=w.given===null?"<em>nem válaszoltál</em>":String.fromCharCode(65+w.given)+") "+it.a[w.given];
    const good=String.fromCharCode(65+it.c)+") "+it.a[it.c];
    return `<li><a onclick="document.getElementById('q${w.i}').scrollIntoView({behavior:'smooth',block:'center'})">${w.i+1}. kérdés</a>: ${title}<br>
      <span class="small">A te válaszod: ${given}<br>Helyes válasz: ${good}</span></li>`;
  }).join("");
  return `<div class="review"><h4>Hibavisszajelző – ${wrong.length} kérdést érdemes átnézni</h4><ul>${items}</ul></div>`;
}

function resetQuiz(){
  document.querySelectorAll("input[type=radio]").forEach(x=>x.checked=false);
  document.querySelectorAll(".question").forEach(x=>x.classList.remove("correct","incorrect"));
  document.querySelectorAll(".explanation").forEach(x=>x.style.display="none");
  document.getElementById("result").classList.add("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
