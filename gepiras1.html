<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gépírás teszt</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#202124;font-family:Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px}
.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1,h2{margin-top:0}
label{display:block;font-weight:700;margin:12px 0 6px}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid #c7cbd1;border-radius:8px;padding:10px}
textarea{min-height:160px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#1a73e8;color:white;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#f1f3f4;border-radius:10px;padding:12px}
.stat b{display:block;font-size:1.35rem;margin-top:4px}
.bar{height:10px;background:#e0e3e7;border-radius:99px;overflow:hidden;margin:10px 0 16px}
.bar>div{height:100%;width:0;background:#1a73e8}
.task-text{white-space:pre-wrap;font-size:1.15rem;line-height:1.55;background:#f8f9fa;border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:#5f6368}
.error{background:#fce8e6;color:#a50e0e;padding:12px;border-radius:8px;margin-bottom:12px}
.success{background:#e6f4ea;color:#137333;padding:12px;border-radius:8px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin:16px 0}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>Gépírás teszt</h1>
<p class="muted">A feladatokat a tanár által kezelt Google Táblázatból tölti be a rendszer.</p>
<div id="error" class="error hidden"></div>

<div id="startPanel">
<label for="studentName">Tanuló neve</label>
<input id="studentName" autocomplete="name">

<label for="studentClass">Osztály</label>
<input id="studentClass" placeholder="pl. 6.a">

<label for="taskCount">Feladatok száma</label>
<input id="taskCount" type="number" min="1" max="50" value="5">

<br><br>
<button id="startBtn">Teszt indítása</button>
</div>
</div>

<div id="testPanel" class="hidden">
<div class="card">

<div class="row">
<div><b id="progressText">1 / 5</b></div>
<div>Hátralévő idő: <b id="timer">--:--</b></div>
</div>

<div class="bar"><div id="progressBar"></div></div>

<div class="task-text" id="taskText"></div>

<textarea id="answer" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

<div class="grid" style="margin-top:12px">
<div class="stat">Helyes<b id="correct">0</b></div>
<div class="stat">Hibás<b id="wrong">0</b></div>
<div class="stat">Rontás<b id="mistakes">0</b></div>
<div class="stat">Leütés<b id="totalTyped">0</b></div>
<div class="stat">Pont<b id="score">0</b></div>
<div class="stat">Eredmény<b id="percent">0%</b></div>
<div class="stat">Sebesség<b id="speed">0</b></div>
</div>

<br>
<button id="nextBtn" disabled>Következő</button>
</div>
</div>

<div id="resultPanel" class="card hidden">
<h2>Végeredmény</h2>

<div class="grid">
<div class="stat">Összpontszám<b id="finalScore">0</b></div>
<div class="stat">Átlag<b id="finalPercent">0%</b></div>
<div class="stat">Helyes<b id="finalCorrect">0</b></div>
<div class="stat">Hibás<b id="finalWrong">0</b></div>
<div class="stat">Rontás<b id="finalMistakes">0</b></div>
<div class="stat">Sebesség<b id="finalSpeed">0</b></div>
</div>

<p id="saveStatus" class="muted">Eredmény mentése...</p>
<div id="detail"></div>
<button onclick="location.reload()">Új teszt</button>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwFUGHRJ4Pn7MSGNgve1GRb8cVUT1ndEKCm5TPlvdlmwJc_B0EeH9JJ_-vNpT4EF2M/exec";

let tasks=[];
let results=[];
let currentIndex=0;
let timerId=null;
let startTime=0;
let remaining=0;
let mistakes=0;
let finished=false;

const $=id=>document.getElementById(id);

function showError(message){
  $("error").textContent=message;
  $("error").classList.remove("hidden");
}
function hideError(){
  $("error").classList.add("hidden");
}

function loadTasks(count){
  return new Promise((resolve,reject)=>{
    const callbackName="tasksCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");

    window[callbackName]=data=>{
      delete window[callbackName];
      script.remove();
      if(data&&data.success) resolve(data.tasks||[]);
      else reject(new Error((data&&data.error)||"A feladatok betöltése sikertelen."));
    };

    script.onerror=()=>{
      delete window[callbackName];
      script.remove();
      reject(new Error("Nem sikerült kapcsolódni a Google Apps Scripthez."));
    };

    script.src=API_URL+
      "?action=getTasks"+
      "&count="+encodeURIComponent(count)+
      "&callback="+encodeURIComponent(callbackName);

    document.body.appendChild(script);
  });
}

function startTest(){
  hideError();

  const name=$("studentName").value.trim();
  const count=Math.max(1,Math.min(50,Number($("taskCount").value)||5));

  if(!name){
    showError("Írd be a tanuló nevét.");
    return;
  }

  $("startBtn").disabled=true;

  loadTasks(count).then(data=>{
    if(!data.length) throw new Error("Nincs aktív feladat a Feladatbank munkalapon.");

    tasks=data;
    results=[];
    currentIndex=0;

    $("startPanel").classList.add("hidden");
    $("testPanel").classList.remove("hidden");

    showTask();
  }).catch(err=>{
    $("startBtn").disabled=false;
    showError(err.message);
  });
}

function showTask(){
  clearInterval(timerId);

  finished=false;
  mistakes=0;

  $("answer").value="";
  $("answer").disabled=false;
  $("nextBtn").disabled=true;
  $("nextBtn").textContent=currentIndex===tasks.length-1?"Befejezés":"Következő";

  const task=tasks[currentIndex];

  remaining=Number(task.time)||60;
  $("taskText").textContent=task.text||"";
  $("progressText").textContent=`${currentIndex+1} / ${tasks.length}`;
  $("progressBar").style.width=`${(currentIndex/tasks.length)*100}%`;

  startTime=performance.now();

  updateTimer();
  updateStats();

  timerId=setInterval(()=>{
    remaining--;
    updateTimer();
    updateStats();

    if(remaining<=0) finishCurrentTask(true);
  },1000);

  $("answer").focus();
}

function updateTimer(){
  const m=Math.floor(Math.max(0,remaining)/60);
  const s=Math.max(0,remaining)%60;
  $("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function calculate(){
  const expected=tasks[currentIndex].text||"";
  const answer=$("answer").value;

  let correct=0;
  let wrong=0;

  for(let i=0;i<Math.max(expected.length,answer.length);i++){
    if(i<answer.length&&i<expected.length&&answer[i]===expected[i]) correct++;
    else if(i<answer.length) wrong++;
  }

  const totalTyped=answer.length;
  const elapsed=Math.max(.001,(performance.now()-startTime)/1000);
  const speed=Math.round(totalTyped/Math.max(elapsed/60,1/60));
  const percent=expected.length?Math.max(0,Math.min(100,Math.round(correct/expected.length*100))):0;
  const pointsMax=Number(tasks[currentIndex].points)||100;
  const score=Math.round(pointsMax*percent/100);

  return {expected,answer,correct,wrong,totalTyped,elapsed,speed,percent,score,mistakes};
}

function updateStats(){
  if(!tasks.length) return;

  const c=calculate();

  $("correct").textContent=c.correct;
  $("wrong").textContent=c.wrong;
  $("mistakes").textContent=c.mistakes;
  $("totalTyped").textContent=c.totalTyped;
  $("score").textContent=c.score;
  $("percent").textContent=c.percent+"%";
  $("speed").textContent=c.speed+" leütés/perc";

  if(c.answer===c.expected&&!finished){
    finishCurrentTask(false);
  }
}

function finishCurrentTask(timedOut){
  if(finished) return;

  finished=true;
  clearInterval(timerId);

  const c=calculate();
  const task=tasks[currentIndex];

  results.push({
    taskId:task.id||"",
    type:task.type||"",
    text:c.expected,
    answer:c.answer,
    correct:c.correct,
    wrong:c.wrong,
    mistakes:c.mistakes,
    totalTyped:c.totalTyped,
    score:c.score,
    percent:c.percent,
    speed:c.speed,
    timeSpent:Math.round(c.elapsed),
    timedOut:!!timedOut
  });

  $("answer").disabled=true;
  $("nextBtn").disabled=false;
}

function nextTask(){
  if(!finished) return;

  if(currentIndex<tasks.length-1){
    currentIndex++;
    showTask();
  }else{
    finishTest();
  }
}

function finishTest(){
  clearInterval(timerId);

  $("testPanel").classList.add("hidden");
  $("resultPanel").classList.remove("hidden");

  const totalScore=results.reduce((s,r)=>s+r.score,0);
  const totalCorrect=results.reduce((s,r)=>s+r.correct,0);
  const totalWrong=results.reduce((s,r)=>s+r.wrong,0);
  const totalMistakes=results.reduce((s,r)=>s+r.mistakes,0);
  const totalTyped=results.reduce((s,r)=>s+r.totalTyped,0);
  const averagePercent=results.length?Math.round(results.reduce((s,r)=>s+r.percent,0)/results.length):0;
  const averageSpeed=results.length?Math.round(results.reduce((s,r)=>s+r.speed,0)/results.length):0;

  $("finalScore").textContent=totalScore;
  $("finalPercent").textContent=averagePercent+"%";
  $("finalCorrect").textContent=totalCorrect;
  $("finalWrong").textContent=totalWrong;
  $("finalMistakes").textContent=totalMistakes;
  $("finalSpeed").textContent=averageSpeed+" leütés/perc";

  $("detail").innerHTML=
    "<table><thead><tr><th>#</th><th>Típus</th><th>Helyes</th><th>Hibás</th><th>Rontás</th><th>%</th></tr></thead><tbody>"+
    results.map((r,i)=>
      `<tr><td>${i+1}</td><td>${escapeHtml(r.type)}</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.mistakes}</td><td>${r.percent}%</td></tr>`
    ).join("")+
    "</tbody></table>";

  saveResult({
    studentName:$("studentName").value.trim(),
    studentClass:$("studentClass").value.trim(),
    taskCount:results.length,
    totalScore,
    averagePercent,
    totalCorrect,
    totalWrong,
    totalMistakes,
    totalTyped,
    averageSpeed,
    tasks:results
  });
}

function saveResult(result){
  $("saveStatus").textContent="Eredmény elküldése a Google Táblázatnak...";

  const iframeName="saveFrame_"+Date.now();

  const iframe=document.createElement("iframe");
  iframe.name=iframeName;
  iframe.style.display="none";

  const form=document.createElement("form");
  form.method="POST";
  form.action=API_URL;
  form.target=iframeName;
  form.style.display="none";

  const input=document.createElement("input");
  input.type="hidden";
  input.name="data";
  input.value=JSON.stringify(result);

  form.appendChild(input);
  document.body.appendChild(iframe);
  document.body.appendChild(form);

  form.submit();

  $("saveStatus").textContent="Az eredmény elküldve a Google Táblázatnak.";

  setTimeout(()=>{
    form.remove();
    iframe.remove();
  },8000);
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[ch]));
}

$("startBtn").addEventListener("click",startTest);
$("nextBtn").addEventListener("click",nextTask);

$("answer").addEventListener("keydown",e=>{
  if(e.key==="Backspace"||e.key==="Delete") mistakes++;
});

$("answer").addEventListener("input",updateStats);
</script>
</body>
</html>
